  <title>作品合集 — W1nkxX</title>
  <script>try{const t=localStorage.getItem("personal-homepage-theme"),m=localStorage.getItem("w1nkxx-dark-default-v1");if(!m){document.documentElement.dataset.theme="dark";localStorage.setItem("personal-homepage-theme","dark");localStorage.setItem("w1nkxx-dark-default-v1","1")}else if(["light","dark","inverse"].includes(t))document.documentElement.dataset.theme=t}catch{}</script>
  <style>
    :root{--paper:#f3f3ef;--paper2:#e7e8e4;--panel:#fafaf7;--ink:#15171a;--muted:#6d7178;--line:rgba(21,23,26,.14);--line2:rgba(21,23,26,.3);--blue:#1557ff;--shadow:0 30px 90px rgba(20,24,34,.13);--sans:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",Arial,sans-serif;--mono:"SFMono-Regular",Consolas,monospace;--ease:cubic-bezier(.2,.8,.2,1)}
    html[data-theme="dark"]{--paper:#181b20;--paper2:#22262d;--panel:#272b32;--ink:#eef1f3;--muted:#aeb4bc;--line:rgba(238,241,243,.14);--line2:rgba(238,241,243,.3);--shadow:0 30px 90px rgba(0,0,0,.34)}
    html[data-theme="inverse"]{--paper:#3b4047;--paper2:#484e56;--panel:#d9dad7;--ink:#f4f5f6;--muted:#c5c9ce;--line:rgba(244,245,246,.15);--line2:rgba(244,245,246,.32);--shadow:0 30px 90px rgba(0,0,0,.3)}
    *{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;min-width:320px;background:var(--paper);color:var(--ink);font-family:var(--sans)}body::before{content:"";position:fixed;inset:0;z-index:-1;background:radial-gradient(circle at 86% 0,rgba(21,87,255,.13),transparent 30rem);pointer-events:none}img,video{-webkit-user-drag:none;-webkit-touch-callout:none;user-select:none}a{color:inherit;text-decoration:none}button{font:inherit}.shell{width:min(1460px,calc(100% - 48px));margin:auto}.header{position:sticky;top:0;z-index:30;height:74px;border-bottom:1px solid var(--line);background:color-mix(in srgb,var(--paper) 88%,transparent);backdrop-filter:blur(18px)}.nav{display:flex;align-items:center;justify-content:space-between;height:100%}.brand img{display:block;width:125px;height:38px;object-fit:contain;object-position:left}.brand:hover img{transform:translateX(4px)}.brand img{transition:.3s var(--ease)}html[data-theme="dark"] .brand img,html[data-theme="inverse"] .brand img{filter:invert(1) brightness(1.15)}.tools{display:flex;align-items:center;gap:8px}.round,.lang button,.back{display:grid;place-items:center;height:40px;border:1px solid var(--line);background:color-mix(in srgb,var(--panel) 64%,transparent);color:var(--ink);cursor:pointer}.round{width:40px;border-radius:50%}.round:hover{background:var(--blue);border-color:var(--blue);color:#fff;transform:rotate(10deg)}.lang{display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden}.lang button{min-width:44px;border:0;background:transparent;font-size:11px;font-weight:850}.lang button[aria-pressed="true"]{background:var(--blue);color:#fff}.back{padding:0 16px;border-radius:999px;font-size:12px;font-weight:800}.back:hover{border-color:var(--ink)}
    .hero{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:20px;padding:100px 0 72px}.eyebrow{grid-column:1/span 3;margin:12px 0 0;color:var(--blue);font:700 11px var(--mono);letter-spacing:.15em;text-transform:uppercase}.hero-copy{grid-column:4/-1}.hero h1{margin:0;font-size:clamp(72px,10vw,148px);line-height:.82;letter-spacing:-.075em}.hero p{max-width:740px;margin:34px 0 0;color:var(--muted);font-size:clamp(17px,1.6vw,23px);line-height:1.55}.stats{display:flex;gap:30px;margin-top:44px}.stat strong{display:block;font-size:28px}.stat span{color:var(--muted);font:700 10px var(--mono);letter-spacing:.12em}
    .filter-wrap{position:sticky;top:74px;z-index:20;margin:0 -24px;padding:14px 24px;border-block:1px solid var(--line);background:color-mix(in srgb,var(--paper) 90%,transparent);backdrop-filter:blur(18px)}.filters{display:flex;gap:8px;overflow:auto;scrollbar-width:none}.filter{white-space:nowrap;min-height:42px;padding:10px 17px;border:1px solid var(--line);border-radius:999px;background:transparent;color:var(--muted);cursor:pointer;font-size:12px;font-weight:800}.filter[aria-pressed="true"],.filter:hover{border-color:var(--blue);background:var(--blue);color:#fff}
    .archive{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:20px;padding:54px 0 130px}.card{grid-column:span 4;display:grid;grid-template-rows:minmax(300px,33vw) auto;padding:0;border:0;background:transparent;color:var(--ink);text-align:left;cursor:pointer}.card.wide{grid-column:span 8}.card.hidden{display:none}.visual{position:relative;overflow:hidden;border:1px solid var(--line);background:var(--paper2)}.visual img{width:100%;height:100%;object-fit:cover;transition:transform .8s var(--ease),filter .4s}.card:hover .visual img{transform:scale(1.035)}.play{position:absolute;left:18px;bottom:18px;display:grid;place-items:center;width:52px;height:52px;border-radius:50%;background:rgba(10,12,16,.8);color:#fff;font-size:15px;backdrop-filter:blur(8px)}.badge{position:absolute;right:14px;top:14px;padding:7px 9px;background:rgba(10,12,16,.72);color:#fff;font:700 9px var(--mono);letter-spacing:.1em}.card-copy{padding:20px 0 30px}.meta{margin:0 0 9px;color:var(--blue);font:700 10px var(--mono);letter-spacing:.11em;text-transform:uppercase}.card h2{margin:0;font-size:clamp(25px,2.7vw,42px);line-height:1.04;letter-spacing:-.045em}.summary{max-width:620px;margin:12px 0 0;color:var(--muted);font-size:14px;line-height:1.65}.empty{grid-column:1/-1;padding:80px 20px;text-align:center;color:var(--muted)}
    dialog{width:min(1240px,calc(100% - 36px));max-height:calc(100svh - 36px);padding:0;border:0;background:var(--panel);color:color-mix(in srgb,var(--ink) 95%,#000);box-shadow:var(--shadow)}html[data-theme="inverse"] dialog{color:#202328}dialog::backdrop{background:rgba(7,9,13,.76);backdrop-filter:blur(7px)}.dialog-head{position:sticky;top:0;z-index:4;display:flex;align-items:center;justify-content:space-between;gap:20px;padding:18px 22px;border-bottom:1px solid rgba(21,23,26,.14);background:color-mix(in srgb,var(--panel) 92%,transparent);backdrop-filter:blur(14px)}.dialog-head strong{font-size:14px}.close{width:42px;height:42px;border:1px solid rgba(21,23,26,.18);border-radius:50%;background:transparent;cursor:pointer}.dialog-body{padding:clamp(18px,4vw,48px)}.dialog-intro{display:grid;grid-template-columns:2fr 1fr;gap:40px;margin-bottom:30px}.dialog-title{margin:0;font-size:clamp(38px,6vw,78px);line-height:.92;letter-spacing:-.06em}.dialog-summary{align-self:end;margin:0;color:#6d7178;line-height:1.7}.viewer{min-height:420px;background:#111;display:grid;place-items:center}.viewer img,.viewer video{display:block;max-width:100%;max-height:78vh;object-fit:contain}.viewer video{width:100%;height:auto}.thumbs{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin-top:10px}.thumb{aspect-ratio:16/10;padding:0;border:2px solid transparent;background:var(--paper2);cursor:pointer;overflow:hidden}.thumb.active{border-color:var(--blue)}.thumb img{width:100%;height:100%;object-fit:cover}.pdf-link{display:inline-flex;margin-top:22px;padding:12px 18px;border-radius:999px;background:var(--blue);color:#fff;font-size:12px;font-weight:850}.dialog-count{font:700 10px var(--mono);color:#6d7178}.reveal{opacity:0;transform:translateY(24px);transition:.7s var(--ease)}.reveal.visible{opacity:1;transform:none}
    footer{display:flex;justify-content:space-between;padding:30px 0 42px;border-top:1px solid var(--line);color:var(--muted);font:700 10px var(--mono);letter-spacing:.1em}
    @media(max-width:1000px){.card,.card.wide{grid-column:span 6}.card{grid-template-rows:minmax(280px,48vw) auto}.thumbs{grid-template-columns:repeat(4,1fr)}}
    @media(max-width:720px){.shell{width:calc(100% - 28px)}.header{height:64px}.brand img{width:106px}.back{display:none}.hero{padding:70px 0 52px}.eyebrow{grid-column:1/-1}.hero-copy{grid-column:1/-1}.hero h1{font-size:clamp(64px,20vw,102px)}.filter-wrap{top:64px;margin-inline:-14px;padding-inline:14px}.archive{padding-top:30px}.card,.card.wide{grid-column:1/-1;grid-template-rows:minmax(320px,96vw) auto}.dialog-intro{grid-template-columns:1fr}.viewer{min-height:260px}.thumbs{grid-template-columns:repeat(3,1fr)}footer{display:grid;gap:8px}}
    @media(max-width:460px){.round{display:none}.stats{gap:18px}.stat strong{font-size:23px}.dialog-body{padding:14px}.dialog-head{padding:12px 14px}.thumbs{grid-template-columns:repeat(2,1fr)}}
    @media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}*,*::before,*::after{transition:none!important}.reveal{opacity:1;transform:none}}
  </style>
</head>
<body>
  <header class="header"><div class="shell nav"><a class="brand" href="personal-homepage-design.html" aria-label="返回主页"><img src="assets/w1nkxx-wordmark-logo.png" alt="W1nkxX"></a><div class="tools"><a class="back" href="personal-homepage-design.html">← <span data-home>返回主页</span></a><button class="round theme" type="button" aria-label="切换主题">☼</button><div class="lang" role="group" aria-label="语言"><button type="button" data-lang="zh" aria-pressed="true">中</button><button type="button" data-lang="en" aria-pressed="false">EN</button></div></div></div></header>
  <main class="shell"><section class="hero"><p class="eyebrow">W1NKXX / PORTFOLIO ARCHIVE</p><div class="hero-copy"><h1 data-title>作品合集</h1><p data-lead>按平面、策划与视频分类整理的完整作品档案。选择任一项目即可查看大图、整套页面或直接播放视频。</p><div class="stats"><div class="stat"><strong>22</strong><span data-stat-g>GRAPHICS</span></div><div class="stat"><strong>32</strong><span data-stat-p>PAGES</span></div><div class="stat"><strong>11</strong><span data-stat-v>VIDEOS</span></div></div></div></section><div class="filter-wrap"><div class="filters" role="group" aria-label="作品分类"></div></div><section class="archive" aria-live="polite"></section></main>
  <footer class="shell"><span>© 2026 W1nkxX</span><span data-footer>GRAPHIC · PLANNING · VIDEO</span></footer>
  <dialog aria-labelledby="dialog-title"><div class="dialog-head"><strong data-dialog-label>PROJECT VIEW</strong><span class="dialog-count"></span><button class="close" type="button" aria-label="关闭">×</button></div><div class="dialog-body"></div></dialog>
  <script src="portfolio-data.js"></script>
  <script>
    (()=>{
      "use strict";
      const DATA=window.W1NKXX_PORTFOLIO,$=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];let lang;try{lang=localStorage.getItem("personal-homepage-language")==="en"?"en":"zh"}catch{lang="zh"}
      const tr=v=>v&&typeof v==="object"?(v[lang]||v.zh||v.en||""):String(v||"");const esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
      const safe=v=>{const s=String(v||"");return /^(?:https?:|[\w./?=&%-]+$)/i.test(s)?s:"#"};
      function protectMedia(scope=document){const media=[];if(scope.matches?.("img,video"))media.push(scope);if(scope.querySelectorAll)media.push(...scope.querySelectorAll("img,video"));media.forEach(item=>{item.draggable=false;item.setAttribute("draggable","false");if(item.tagName==="VIDEO"){item.setAttribute("controlslist","nodownload noremoteplayback");item.setAttribute("disablepictureinpicture","");item.setAttribute("disableremoteplayback","");item.setAttribute("x-webkit-airplay","deny");item.disablePictureInPicture=true;item.disableRemotePlayback=true}})}
      const blockMediaSave=event=>{if(event.target instanceof Element&&event.target.closest("img,video"))event.preventDefault()};document.addEventListener("contextmenu",blockMediaSave,{capture:true});document.addEventListener("dragstart",blockMediaSave,{capture:true});new MutationObserver(records=>records.forEach(record=>record.addedNodes.forEach(node=>{if(node.nodeType===1)protectMedia(node)}))).observe(document.body,{childList:true,subtree:true});protectMedia();
      const copy={zh:{home:"返回主页",title:"作品合集",lead:"按平面、策划与视频分类整理的完整作品档案。选择任一项目即可查看大图、整套页面或直接播放视频。",open:"打开项目",pdf:"打开原始 PDF",graphic:"平面文件",page:"策划页",video:"视频",footer:"平面 · 策划 · 视频"},en:{home:"Back home",title:"Portfolio Archive",lead:"A complete archive organized into graphics, planning, and video. Open any project to view images, browse full decks, or play video.",open:"Open project",pdf:"Open original PDF",graphic:"Graphic files",page:"Planning pages",video:"Videos",footer:"GRAPHIC · PLANNING · VIDEO"}};const C=()=>copy[lang];
      let active=new URLSearchParams(location.search).get("category")||"all";if(!DATA.categories.some(c=>c.id===active))active="all";
      function render(){document.documentElement.lang=lang==="zh"?"zh-CN":"en";$("[data-home]").textContent=C().home;$("[data-title]").textContent=C().title;$("[data-lead]").textContent=C().lead;$("[data-footer]").textContent=C().footer;$("[data-stat-g]").textContent=C().graphic;$("[data-stat-p]").textContent=C().page;$("[data-stat-v]").textContent=C().video;
        $(".filters").innerHTML=DATA.categories.map(cat=>{const n=cat.id==="all"?DATA.works.length:DATA.works.filter(w=>w.category===cat.id).length;return `<button class="filter" type="button" data-category="${cat.id}" aria-pressed="${cat.id===active}">${esc(tr(cat.label))} · ${n}</button>`}).join("");
        const works=DATA.works.filter(w=>active==="all"||w.category===active);$(".archive").innerHTML=works.length?works.map((w,i)=>`<button class="card ${w.featured&&i%3===0?"wide":""} reveal" type="button" data-work="${esc(w.id)}"><span class="visual"><img src="${safe(w.cover)}" alt="" loading="lazy" draggable="false"><span class="badge">${esc(w.category.toUpperCase())}</span>${w.type==="video"?'<span class="play">▶</span>':""}</span><span class="card-copy"><span class="meta">${esc(tr(w.meta))}</span><h2>${esc(tr(w.title))}</h2><p class="summary">${esc(tr(w.summary))}</p></span></button>`).join(""):`<p class="empty">No work in this category.</p>`;
        $$("[data-lang]").forEach(b=>b.setAttribute("aria-pressed",String(b.dataset.lang===lang)));bindCards();observe();
      }
      function bindCards(){$$("[data-work]").forEach(card=>card.addEventListener("click",()=>openWork(card.dataset.work)));$$("[data-category]").forEach(button=>button.addEventListener("click",()=>{active=button.dataset.category;const u=new URL(location.href);u.searchParams.set("category",active);u.searchParams.delete("work");history.replaceState({},"",u);render()}))}
      let observer;function observe(){observer?.disconnect();observer=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add("visible");observer.unobserve(e.target)}}),{threshold:.08});$$(".reveal").forEach(el=>observer.observe(el))}
      function openWork(id){const work=DATA.works.find(w=>w.id===id);if(!work)return;const dialog=$("dialog"),body=$(".dialog-body");$(".dialog-count").textContent=tr(work.meta);let viewer="";
        if(work.type==="video")viewer=`<div class="viewer"><video controls autoplay playsinline controlslist="nodownload noremoteplayback" disablepictureinpicture disableremoteplayback x-webkit-airplay="deny" poster="${safe(work.cover)}"><source src="${safe(work.asset)}" type="video/mp4"></video></div>`;
        else if(work.type==="gallery"||work.type==="pdf"){viewer=`<div class="viewer"><img data-main-image src="${safe(work.gallery[0])}" alt="${esc(tr(work.title))}" draggable="false"></div><div class="thumbs">${work.gallery.map((src,i)=>`<button class="thumb ${i===0?"active":""}" type="button" data-image="${safe(src)}" aria-label="${i+1}"><img src="${safe(src)}" alt="" loading="lazy" draggable="false"></button>`).join("")}</div>${work.type==="pdf"?`<a class="pdf-link" href="${safe(work.asset)}" target="_blank" rel="noopener">${C().pdf} ↗</a>`:""}`}
        else viewer=`<div class="viewer"><img src="${safe(work.asset||work.cover)}" alt="${esc(tr(work.title))}" draggable="false"></div>`;
        body.innerHTML=`<div class="dialog-intro"><h2 class="dialog-title" id="dialog-title">${esc(tr(work.title))}</h2><p class="dialog-summary">${esc(tr(work.summary))}</p></div>${viewer}`;dialog.showModal();document.body.style.overflow="hidden";const u=new URL(location.href);u.searchParams.set("work",work.id);history.replaceState({},"",u);$$('[data-image]').forEach(btn=>btn.addEventListener("click",()=>{$("[data-main-image]").src=btn.dataset.image;$$('[data-image]').forEach(x=>x.classList.toggle("active",x===btn));$(".viewer").scrollIntoView({block:"nearest"})}))
      }
      function closeDialog(){const d=$("dialog");d.querySelector("video")?.pause();d.close();document.body.style.overflow="";const u=new URL(location.href);u.searchParams.delete("work");history.replaceState({},"",u)}
      $(".close").addEventListener("click",closeDialog);$("dialog").addEventListener("click",e=>{if(e.target===$("dialog"))closeDialog()});
      $$("[data-lang]").forEach(b=>b.addEventListener("click",()=>{lang=b.dataset.lang;try{localStorage.setItem("personal-homepage-language",lang)}catch{}render()}));
      const themes=["light","dark","inverse"];function applyTheme(t){document.documentElement.dataset.theme=t;$(".theme").textContent=({light:"☼",dark:"◐",inverse:"◑"})[t];try{localStorage.setItem("personal-homepage-theme",t)}catch{}document.querySelector('meta[name="theme-color"]').content=({light:"#f3f3ef",dark:"#181b20",inverse:"#3b4047"})[t]}applyTheme(themes.includes(document.documentElement.dataset.theme)?document.documentElement.dataset.theme:"dark");$(".theme").addEventListener("click",()=>applyTheme(themes[(themes.indexOf(document.documentElement.dataset.theme)+1)%3]));
      render();const requested=new URLSearchParams(location.search).get("work");if(requested)requestAnimationFrame(()=>openWork(requested));
    })();
  </script>
</body>
</html>
