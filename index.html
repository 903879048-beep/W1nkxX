      async function openHeroFullView(item){const dialog=$("[data-full-dialog]"),preview=$("[data-hero-canvas] video");if(!dialog||!item||carouselFullOpen||carouselTransitioning)return;carouselFullOpen=true;clearTimeout(fullPromptTimer);$("[data-full-prompt]").classList.remove("show");await fadeVideoVolume(preview,0,reducedMotion()?0:220);preview?.pause();populateFullViewer(item);dialog.showModal();document.body.style.overflow="hidden";const fullVideo=$("[data-full-media] video");if(fullVideo){fullVideo.volume=carouselVolume;fullVideo.muted=!heroHasAudio(item);fullVideo.play().catch(()=>{})}fullPromptTimer=setTimeout(()=>$("[data-full-prompt]")?.classList.add("show"),reducedMotion()?120:4000)}
